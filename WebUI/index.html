<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundBox</title>
<style>
  :root { --accent:#e8b64c; --ink:#c6ccd4; --bg:#0b0d10; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:
      radial-gradient(600px 320px at 50% 30%, rgba(255,226,170,.06), transparent 62%),
      linear-gradient(180deg,#0a0c10 0%,#0b0d10 55%,#151009 100%);
    color:var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    user-select:none; -webkit-user-select:none; overflow:hidden;
  }
  .wrap { padding:10px 18px 12px; max-width:940px; margin:0 auto;
    height:100%; display:flex; flex-direction:column; }

  /* landscape: amp+cab on the left, pedalboard (wider) on the right */
  .rig { display:flex; gap:16px; align-items:stretch; margin-top:4px; flex:1 1 auto; min-height:0; }
  .left { flex:1 1 0; min-width:300px; display:flex; flex-direction:column; }
  .right { flex:1.35 1 0; min-width:360px; display:flex; }
  header { display:flex; align-items:baseline; gap:.5rem; }
  h1 { font-size:1.05rem; margin:0; letter-spacing:-.02em; color:#eef1f4; }
  h1 .a { color:var(--accent); }
  .sub { font-size:.58rem; color:#7f8a78; }

  /* pickers */
  .pickers { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; flex:0 0 auto; }
  header { flex:0 0 auto; }
  .pick { display:flex; align-items:center; gap:6px; }
  .pick span { font-size:.58rem; letter-spacing:.14em; color:#7f8a78; }
  select {
    appearance:none; -webkit-appearance:none;
    background:color-mix(in oklab, var(--accent) 12%, #14171a);
    color:#eef1f4; border:1px solid var(--accent); border-radius:8px;
    padding:5px 22px 5px 9px; font-family:inherit; font-size:.72rem; cursor:pointer;
    box-shadow:0 0 12px -6px var(--accent);
  }

  /* A/B + user presets */
  .ab { display:inline-flex; gap:4px; align-items:center; }
  .abtn { min-width:26px; padding:5px 0; border-radius:7px; border:1px solid var(--accent);
    background:color-mix(in oklab,var(--accent) 10%,#14171a); color:#eef1f4; font-family:inherit;
    font-size:.7rem; font-weight:700; cursor:pointer; }
  .abtn.on { background:var(--accent); color:#141210; }
  .mini2 { padding:5px 8px; border-radius:7px; border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(#2c2e33,#17181c); color:#d7dbe0; font-family:inherit; font-size:.62rem;
    letter-spacing:.06em; cursor:pointer; }
  .mini2:active { transform:translateY(1px); }
  .uname { width:80px; background:#14171a; color:#eef1f4; border:1px solid rgba(255,255,255,.2);
    border-radius:7px; padding:4px 7px; font-family:inherit; font-size:.66rem; }
  .uname::placeholder { color:#5f6a63; }

  /* amp head */
  .amp {
    border-radius:12px 12px 5px 5px; padding:12px 12px 12px; margin-top:4px;
    background:var(--chassis, linear-gradient(#20272a,#12181a));
    border:1px solid rgba(0,0,0,.65);
    box-shadow:0 14px 28px -18px rgba(0,0,0,.9), inset 0 2px 0 rgba(255,255,255,.10), inset 0 -3px 10px rgba(0,0,0,.5);
  }
  .amp-top { display:flex; align-items:center; justify-content:space-between; padding:0 4px 8px; }
  .logo { font-size:.8rem; font-weight:800; letter-spacing:.24em; color:#eef1f4; }
  .logo span { color:var(--accent); }
  .jewel { width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, color-mix(in oklab,var(--accent) 70%,white), var(--accent));
    box-shadow:0 0 8px var(--accent), 0 0 14px var(--accent); }
  .amp-panel {
    border-radius:8px; padding:10px 8px 8px;
    background:linear-gradient(#20232a,#14161b), repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
    border:1px solid rgba(0,0,0,.6); box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 8px rgba(0,0,0,.55);
  }
  /* live spectrum screen */
  .scope { width:100%; height:52px; display:block; border-radius:6px; margin-bottom:9px;
    background:radial-gradient(120% 150% at 50% 0%, #101c14, #050908 72%);
    border:1px solid rgba(0,0,0,.65);
    box-shadow:inset 0 0 14px rgba(0,0,0,.75), inset 0 0 0 1px rgba(120,255,170,.06); }
  .krow { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 4px; justify-items:center; }
  .amp-row { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .amp-photo { width:36px; height:24px; border-radius:4px; background:#0d0f0c center/cover;
    border:1px solid rgba(255,255,255,.18); box-shadow:0 1px 3px rgba(0,0,0,.6); }
  .ir-row { gap:7px; }
  .ir-btn { padding:4px 10px; border-radius:7px; border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(#2c2e33,#17181c); color:#d7dbe0; font-family:inherit; font-size:.58rem;
    letter-spacing:.1em; cursor:pointer; }
  .ir-btn:active { transform:translateY(1px); }
  .ir-name { flex:1; min-width:0; font-size:.56rem; color:#8a938c; letter-spacing:.06em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ir-name.loaded { color:var(--accent); }
  .ir-x { width:18px; height:18px; padding:0; border-radius:5px; border:1px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.28); color:#9aa0a8; font-size:.6rem; cursor:pointer; display:none; }
  .ir-x.show { display:inline-block; }
  .meter { flex:1; height:8px; border-radius:4px; background:#060806; border:1px solid rgba(0,0,0,.6); overflow:hidden; }
  .meter i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#4caf50,#e8b64c 72%,#e0684c); transition:width .05s linear; }

  /* cabinet */
  .cab {
    position:relative; flex:1 1 auto; min-height:150px; margin-top:-2px; border-radius:4px 4px 12px 12px;
    background:linear-gradient(#181a1e,#0b0c0f); border:1px solid rgba(0,0,0,.7);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.06), inset 0 -3px 10px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .cab::after { content:""; position:absolute; inset:6px; border-radius:3px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.26) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.26) 0 1px, transparent 1px 4px),
      linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.5)),
      var(--grille, #0d0f0c);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.7); }
  .cab-badge { position:absolute; z-index:1; bottom:7px; left:50%; transform:translateX(-50%);
    padding:2px 10px; border-radius:4px; background:rgba(6,8,10,.55); border:1px solid rgba(255,255,255,.14);
    font-size:.54rem; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.9);
    text-shadow:0 1px 3px rgba(0,0,0,.9); }

  /* pedalboard — two rows of tall pedals (drag to reorder within a row) */
  .board {
    flex:1 1 auto; min-height:0; overflow:auto; display:flex; flex-direction:column; justify-content:center; gap:22px; padding:16px 12px;
    border-radius:10px;
    background:repeating-linear-gradient(180deg,#34383f 0 9px,#2a2d33 9px 12px,#23262b 12px 21px,#191b1f 21px 24px);
    border:1px solid rgba(0,0,0,.7);
    box-shadow:0 14px 26px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .brow { display:flex; align-items:stretch; justify-content:center; gap:11px; flex-wrap:nowrap; overflow-x:auto; }
  .stomp {
    position:relative; flex:0 0 auto; width:92px; min-height:158px; border-radius:12px; padding:13px 7px 10px;
    display:flex; flex-direction:column; align-items:center; gap:5px; color:#14140f;
    transition:transform .12s ease, box-shadow .12s ease;
    background:
      /* per-pedal finish overlay */
      var(--tex, none),
      /* four corner screws */
      radial-gradient(circle at 11px 11px, #0c0d10 0 1.7px, rgba(255,255,255,.22) 2.1px 2.7px, transparent 3.1px),
      radial-gradient(circle at calc(100% - 11px) 11px, #0c0d10 0 1.7px, rgba(255,255,255,.22) 2.1px 2.7px, transparent 3.1px),
      radial-gradient(circle at 11px calc(100% - 11px), #0c0d10 0 1.7px, rgba(255,255,255,.22) 2.1px 2.7px, transparent 3.1px),
      radial-gradient(circle at calc(100% - 11px) calc(100% - 11px), #0c0d10 0 1.7px, rgba(255,255,255,.22) 2.1px 2.7px, transparent 3.1px),
      /* glossy top sheen */
      radial-gradient(120% 65% at 50% -12%, rgba(255,255,255,.4), transparent 62%),
      /* enamel body */
      linear-gradient(180deg, color-mix(in oklab,var(--pc) 82%,white 24%), var(--pc) 44%, color-mix(in oklab,var(--pc) 68%,black 32%));
    border:1px solid rgba(0,0,0,.6);
    box-shadow:0 12px 18px -7px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.5),
      inset 0 -7px 14px rgba(0,0,0,.28);
  }
  .stomp::before { content:""; position:absolute; inset:5px; border-radius:9px; pointer-events:none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 0 16px rgba(0,0,0,.2); }

  /* each pedal a different look */
  .stomp.wide { width:150px; }
  .p-comp   { --tex: repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 1px, transparent 1px 4px); border-radius:12px; }
  .p-drive  { --tex: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 7px, rgba(0,0,0,.05) 7px 15px); border-radius:9px 9px 17px 17px; }
  .p-chorus { --tex: radial-gradient(rgba(255,255,255,.14) .6px, transparent 1.2px) 0 0 / 7px 7px; border-radius:18px; }
  .p-delay  { --tex: linear-gradient(180deg, rgba(0,0,0,.22) 0 30%, transparent 30% 70%, rgba(0,0,0,.14) 70%); border-radius:7px; }
  .p-trem   { --tex: repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 3px, transparent 3px 9px); border-radius:14px 14px 8px 8px; }
  .p-phaser { --tex: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 4px, rgba(0,0,0,.06) 4px 10px); border-radius:10px; }
  .p-flanger { --tex: repeating-radial-gradient(circle at 50% 0%, rgba(255,255,255,.06) 0 3px, transparent 3px 7px); border-radius:8px 8px 15px 15px; }
  .p-boost  { --tex: linear-gradient(180deg, rgba(255,255,255,.14) 0 20%, transparent 20%); border-radius:16px; }
  .p-wah    { --tex: repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 5px, rgba(0,0,0,.07) 5px 12px); border-radius:15px 15px 9px 9px; }

  /* drag handle to reorder */
  .sb-grip { align-self:stretch; height:15px; margin:-9px -3px 3px; border-radius:9px 9px 4px 4px;
    background:rgba(0,0,0,.20); box-shadow:inset 0 -1px 0 rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .sb-grip::before { content:"⠿ ⠿"; font-size:.6rem; letter-spacing:-1px; color:rgba(0,0,0,.5); }
  .stomp.grab { z-index:6; transform:translateY(-6px) scale(1.05);
    box-shadow:0 18px 26px -8px rgba(0,0,0,.75), inset 0 2px 0 rgba(255,255,255,.5); }

  .stomp .knobs { display:flex; justify-content:center; gap:6px; }
  .sb-name { margin-top:auto; font-size:.58rem; font-weight:800; letter-spacing:.16em; color:#141210;
    text-shadow:0 1px 0 rgba(255,255,255,.4); opacity:.92; }
  .sb-led { width:9px; height:9px; border-radius:50%; margin-top:1px;
    background:radial-gradient(circle at 35% 30%, #4a4a4a, #111);
    box-shadow:0 0 0 2px rgba(0,0,0,.35), inset 0 0 2px rgba(0,0,0,.9); }
  .sb-led.on { background:radial-gradient(circle at 35% 30%, #ffd6cd, #ff2f2f 62%, #b30f0f);
    box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 0 8px #ff3b3b, 0 0 15px #ff2a2a; }
  .sb-switch { width:38px; height:38px; border-radius:50%; padding:0; cursor:pointer; margin-top:2px;
    background:
      radial-gradient(circle at 50% 30%, #5c606a, #202329 72%),
      conic-gradient(#2a2c31,#15171b,#2a2c31,#15171b,#2a2c31);
    border:1px solid rgba(0,0,0,.7);
    box-shadow:0 5px 8px -2px rgba(0,0,0,.6), inset 0 2px 2px rgba(255,255,255,.3), inset 0 -3px 5px rgba(0,0,0,.5);
    display:grid; place-items:center; }
  .sb-switch:active { transform:translateY(2px); box-shadow:0 2px 4px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.2); }
  .sb-cap { width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 40% 30%, #f2f4f7, #bcc0c8 46%, #6d7178 70%, #2f3236);
    box-shadow:inset 0 -1px 2px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.85), 0 1px 1px rgba(0,0,0,.45); }
  .stomp.off { filter:saturate(.45) brightness(.8); }

  /* knob — metallic cap with a coloured value ring */
  .knob { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .dial { width:40px; height:40px; border-radius:50%; position:relative; cursor:grab; touch-action:none;
    background:conic-gradient(from -135deg, var(--kc,var(--accent)) 0deg, rgba(0,0,0,.4) 0deg 270deg, transparent 270deg);
    box-shadow:inset 0 0 0 3.5px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.5); }
  .dial:active { cursor:grabbing; }
  .dial::after { content:""; position:absolute; inset:6px; border-radius:50%;
    background:radial-gradient(circle at 38% 26%, #eef1f4 0 5%, #9aa0a8 24%, #3b3e44 62%, #191b1f 100%);
    box-shadow:inset 0 2px 2px rgba(255,255,255,.5), inset 0 -3px 5px rgba(0,0,0,.6), 0 1px 1px rgba(0,0,0,.4); }
  .ptr { position:absolute; left:50%; top:6px; width:2.5px; height:10px; margin-left:-1.25px; z-index:2;
    background:#111318; border-radius:2px; transform-origin:50% 14px; box-shadow:0 0 1px rgba(0,0,0,.7); }
  .k-label { font-size:.5rem; letter-spacing:.08em; opacity:.9; }
  .amp .k-label { color:#c6ccd4; }
  .stomp .k-label { color:#141210; text-shadow:0 1px 0 rgba(255,255,255,.3); }
  .k-val { font-size:.55rem; color:var(--kc,var(--accent)); font-variant-numeric:tabular-nums; }
  .stomp .k-val { color:#141210; }

  /* segmented + toggle */
  .seg { display:inline-flex; border-radius:7px; overflow:hidden; border:1px solid rgba(0,0,0,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  .seg button { background:linear-gradient(#2c2e33,#17181c); color:#d7dbe0; border:none; padding:3px 8px;
    font-family:inherit; font-size:.6rem; font-weight:700; cursor:pointer; }
  .seg button + button { border-left:1px solid rgba(0,0,0,.5); }
  .seg button.on { background:var(--pc); color:#141210; text-shadow:0 1px 0 rgba(255,255,255,.3); }
  .sb-sync { display:flex; gap:4px; align-items:center; }
  .mini { font-size:.5rem; padding:2px 5px; border-radius:5px; border:1px solid rgba(0,0,0,.5);
    background:rgba(0,0,0,.2); color:#141210; font-weight:700; cursor:pointer; }
  .mini.on { background:#141210; color:var(--pc); }
  .mini-sel { font-size:.5rem; padding:1px 3px; border-radius:5px; border:1px solid rgba(0,0,0,.5);
    background:rgba(0,0,0,.16); color:#141210; font-family:inherit; }
  .toggle { padding:4px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.28); color:#c6ccd4; font-family:inherit; font-size:.6rem; letter-spacing:.12em; cursor:pointer; }
  .toggle.on { color:var(--accent); border-color:var(--accent); background:color-mix(in oklab,var(--accent) 16%,transparent); box-shadow:0 0 10px -3px var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header><h1>sound<span class="a">//</span>box</h1><span class="sub">guitar multi-fx · plugin</span></header>

    <div class="pickers">
      <label class="pick"><span>ARTIST</span><select id="artist"></select></label>
      <label class="pick" id="songWrap"><span>SONG</span><select id="song"></select></label>
      <label class="pick"><span>A/B</span>
        <span class="ab"><button id="slotA" class="abtn on">A</button><button id="slotB" class="abtn">B</button><button id="abCopy" class="mini2" title="copy to the other slot">COPY→</button></span>
      </label>
      <label class="pick"><span>USER</span>
        <select id="userSel"><option value="">— recall —</option></select>
        <input id="userName" class="uname" placeholder="name" spellcheck="false" />
        <button id="userSave" class="mini2">SAVE</button>
        <button id="userDel" class="mini2">DEL</button>
      </label>
    </div>

    <div class="rig">
      <div class="left">
        <div class="amp" id="amp">
          <div class="amp-top"><div class="logo">SOUND<span>//</span>BOX</div><div class="amp-photo" id="ampPhoto"></div><span class="jewel"></span></div>
          <div class="amp-panel">
            <canvas class="scope" id="scope" width="360" height="52"></canvas>
            <div class="krow" id="ampKnobs"></div>
            <div class="amp-row"><button class="toggle" id="cab">CAB SIM</button><div class="meter"><i id="meterFill"></i></div></div>
            <div class="amp-row ir-row">
              <button class="toggle" id="irOn">IR</button>
              <button class="ir-btn" id="irLoad">LOAD IR</button>
              <span class="ir-name" id="irName">no cabinet</span>
              <button class="ir-x" id="irClear" title="remove IR">✕</button>
            </div>
          </div>
        </div>
        <div class="cab" id="cabVisual"><span class="cab-badge" id="badge">CLEAN</span></div>
      </div>
      <div class="right">
        <div class="board" id="board">
          <div class="brow" id="rowTop"></div>
          <div class="brow" id="rowBottom"></div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  import * as Juce from "./js/juce.js";

  const el = (t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};

  // output level meter (driven from the DSP by the editor timer)
  const meterFill = document.getElementById("meterFill");
  window.__meter = (v)=>{ if (meterFill) meterFill.style.width = Math.min(100, v*100) + "%"; };

  // live spectrum screen (bands pushed from the DSP; drawn smoothly via rAF)
  const scope = document.getElementById("scope");
  const sctx = scope.getContext("2d");
  const NB = 32;
  let specTarget = new Array(NB).fill(0);
  let specDisp = new Array(NB).fill(0);
  window.__spectrum = (arr)=>{ if (Array.isArray(arr)) specTarget = arr; };
  function fitScope(){
    const r = scope.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    scope.width = Math.max(1, Math.round(r.width * dpr));
    scope.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener("resize", fitScope);
  function drawScope(){
    const w = scope.width, h = scope.height, n = specDisp.length;
    sctx.clearRect(0, 0, w, h);
    sctx.strokeStyle = "rgba(120,255,170,.10)";
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, h - 0.5); sctx.lineTo(w, h - 0.5); sctx.stroke();
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#7fe08a";
    const gap = Math.max(1, w * 0.004), bw = (w - gap * (n - 1)) / n;
    for (let i = 0; i < n; i++){
      specDisp[i] += ((specTarget[i] || 0) - specDisp[i]) * 0.35;
      const bh = Math.max(1, specDisp[i] * (h - 3));
      const x = i * (bw + gap), y = h - bh;
      const g = sctx.createLinearGradient(0, h, 0, 0);
      g.addColorStop(0, "rgba(70,190,110,.85)");
      g.addColorStop(.7, accent);
      g.addColorStop(1, "#ffffff");
      sctx.fillStyle = g; sctx.fillRect(x, y, bw, bh);
    }
    requestAnimationFrame(drawScope);
  }
  fitScope(); drawScope();

  // parameter ranges (must match the C++ layout) — for preset normalisation
  const RANGE = {
    gate:[0,1], comp:[0,1], drive:[0,1], low:[-18,18], mid:[-18,18], high:[-18,18],
    delayMix:[0,1], delayTime:[0.02,1], delayFb:[0,0.9], chorus:[0,1], reverb:[0,1], level:[0,1.5],
  };
  const fmt = {
    pct:v=>Math.round(v*100)+"%", db:v=>(v>0?"+":"")+v.toFixed(0), ms:v=>Math.round(v*1000)+"ms",
    hz:v=>v.toFixed(1)+"Hz",
  };

  const states = {};       // id -> slider state
  function makeKnob(parent, id, label, kind, kc) {
    const state = Juce.getSliderState(id); states[id] = state;
    const wrap=el("div","knob"), dial=el("div","dial"), ptr=el("div","ptr");
    if (kc) { dial.style.setProperty("--kc", kc); }
    dial.appendChild(ptr);
    const lab=el("div","k-label"); lab.textContent=label;
    const val=el("div","k-val");
    wrap.append(dial,lab,val); parent.appendChild(wrap);
    const render=()=>{ try {
      const n=state.getNormalisedValue();
      ptr.style.transform=`rotate(${-135+n*270}deg)`;
      dial.style.background=`conic-gradient(from -135deg, ${kc||"var(--accent)"} ${n*270}deg, #23262b ${n*270}deg 270deg, transparent 270deg)`;
      const sv=state.getScaledValue();
      val.textContent=Number.isFinite(sv)?fmt[kind](sv):"";
    } catch(e){} };
    let dg=false,sy=0,sn=0;
    dial.addEventListener("pointerdown",e=>{dg=true;sy=e.clientY;sn=state.getNormalisedValue();dial.setPointerCapture(e.pointerId);state.sliderDragStarted();});
    dial.addEventListener("pointermove",e=>{if(!dg)return;let v=sn+(sy-e.clientY)/150;v=Math.max(0,Math.min(1,v));state.setNormalisedValue(v);render();});
    const end=e=>{if(!dg)return;dg=false;state.sliderDragEnded();dial.releasePointerCapture?.(e.pointerId);};
    dial.addEventListener("pointerup",end); dial.addEventListener("pointercancel",end);
    state.valueChangedEvent.addListener(render); render();
  }

  // amp knobs
  makeKnob(document.getElementById("ampKnobs"),"gate","GATE","pct");
  makeKnob(document.getElementById("ampKnobs"),"low","LOW","db");
  makeKnob(document.getElementById("ampKnobs"),"mid","MID","db");
  makeKnob(document.getElementById("ampKnobs"),"high","HIGH","db");
  makeKnob(document.getElementById("ampKnobs"),"reverb","REVERB","pct");
  makeKnob(document.getElementById("ampKnobs"),"level","LEVEL","pct");

  // cab toggle
  const cab=Juce.getToggleState("cab");
  const cabEl=document.getElementById("cab");
  cabEl.onclick=()=>cab.setValue(!cab.getValue());
  const paintCab=()=>cabEl.classList.toggle("on",cab.getValue());
  cab.valueChangedEvent.addListener(paintCab); paintCab();

  // IR cabinet loader (real speaker convolution)
  const irOn=Juce.getToggleState("irOn");
  const irOnEl=document.getElementById("irOn");
  irOnEl.onclick=()=>irOn.setValue(!irOn.getValue());
  const paintIrOn=()=>irOnEl.classList.toggle("on",irOn.getValue());
  irOn.valueChangedEvent.addListener(paintIrOn); paintIrOn();

  const irNameEl=document.getElementById("irName");
  const irClearEl=document.getElementById("irClear");
  const loadIRfn=Juce.getNativeFunction("loadIR");
  const clearIRfn=Juce.getNativeFunction("clearIR");
  window.__irName=(name, loaded)=>{
    irNameEl.textContent = loaded && name ? name : "no cabinet";
    irNameEl.classList.toggle("loaded", !!loaded);
    irClearEl.classList.toggle("show", !!loaded);
  };
  document.getElementById("irLoad").onclick=()=>{ try{ loadIRfn(); }catch(e){} };
  irClearEl.onclick=()=>{ try{ clearIRfn(); }catch(e){} };
  try { Juce.getNativeFunction("requestIR")(); } catch(e){}   // sync current IR on open

  // pedalboard — two rows of stompboxes
  const rowTop=document.getElementById("rowTop");
  const rowBottom=document.getElementById("rowBottom");
  const dist=Juce.getComboBoxState("distType");

  // pointer-based drag reorder (mouse + touch), scoped to each row.
  // The top row is the reorderable DSP chain — its order is pushed to the engine.
  const setOrderFn = Juce.getNativeFunction("setOrder");
  const IDX = { comp:0, drive:1, chorus:2, delay:3 };
  function commitOrder() {
    const order=[...rowTop.querySelectorAll(".stomp")].map(b=>{
      for (const k in IDX) if (b.classList.contains("p-"+k)) return IDX[k];
      return 0;
    });
    while (order.length < 4) order.push(order.length);
    try { setOrderFn(order[0], order[1], order[2], order[3]); } catch(e){}
  }
  function addDrag(grip, box) {
    grip.addEventListener("pointerdown", e=>{
      e.preventDefault();
      box.classList.add("grab");
      const row=box.parentElement;
      const move=ev=>{
        const others=[...row.querySelectorAll(".stomp")].filter(b=>b!==box);
        let ref=null;
        for (const b of others){ const r=b.getBoundingClientRect(); if (ev.clientX < r.left+r.width/2){ ref=b; break; } }
        row.insertBefore(box, ref);
      };
      const up=()=>{
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        box.classList.remove("grab");
        if (row===rowTop) commitOrder();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
  }

  function stompbox(row, name, pc, onId, build) {
    try { buildStomp(row, name, pc, onId, build); }
    catch (e) { console.error("stompbox failed:", name, e); }
  }
  function buildStomp(row, name, pc, onId, build) {
    const cls=onId.replace("On","");
    const box=el("div","stomp p-"+cls); box.style.setProperty("--pc",pc);
    if (onId==="delayOn") box.classList.add("wide");
    const grip=el("div","sb-grip"); box.appendChild(grip); addDrag(grip, box);
    const knobs=el("div","knobs"); box.appendChild(knobs);
    build(knobs, box);
    const nm=el("div","sb-name"); nm.textContent=name; box.appendChild(nm);
    const led=el("span","sb-led"); box.appendChild(led);
    const sw=el("button","sb-switch"); sw.appendChild(el("span","sb-cap")); box.appendChild(sw);
    row.appendChild(box);

    const on=Juce.getToggleState(onId);
    sw.onclick=()=>on.setValue(!on.getValue());
    const paint=()=>{ const v=on.getValue(); led.classList.toggle("on",v); box.classList.toggle("off",!v); };
    on.valueChangedEvent.addListener(paint); paint();
  }

  // ── top row: the reorderable core chain ──
  stompbox(rowTop,"SQUISH","#4a86b0","compOn",(k)=>makeKnob(k,"comp","COMP","pct","#4a86b0"));
  stompbox(rowTop,"OVERDRIVE","#d98a3d","driveOn",(k,box)=>{
    makeKnob(k,"drive","DRIVE","pct","#d98a3d");
    const seg=el("div","seg");
    const choices=(dist.properties && dist.properties.choices) || ["Soft","Hard","Fuzz"];
    const btns=choices.map((c,i)=>{ const b=el("button"); b.textContent=c[0]; b.onclick=()=>dist.setChoiceIndex(i); seg.appendChild(b); return b; });
    box.appendChild(seg);
    const paint=()=>btns.forEach((b,i)=>b.classList.toggle("on",i===dist.getChoiceIndex()));
    dist.valueChangedEvent.addListener(paint);
    dist.propertiesChangedEvent.addListener(paint); paint();
  });
  stompbox(rowTop,"SHIMMER","#3aa6a0","chorusOn",(k)=>makeKnob(k,"chorus","DEPTH","pct","#3aa6a0"));
  stompbox(rowTop,"ECHO","#6a8f4f","delayOn",(k,box)=>{
    makeKnob(k,"delayMix","MIX","pct","#6a8f4f");
    makeKnob(k,"delayTime","TIME","ms","#6a8f4f");
    makeKnob(k,"delayFb","RPTS","pct","#6a8f4f");
    // tempo sync: lock the delay time to the host BPM
    const sync=Juce.getToggleState("delaySync");
    const div=Juce.getComboBoxState("delayDiv");
    const syncRow=el("div","sb-sync");
    const sbtn=el("button","mini"); sbtn.textContent="SYNC";
    sbtn.onclick=()=>sync.setValue(!sync.getValue());
    const sel=el("select","mini-sel");
    const choices=(div.properties&&div.properties.choices)||["1/4","1/8","1/8.","1/16","1/4."];
    choices.forEach((c,i)=>{const o=el("option");o.value=i;o.textContent=c;sel.appendChild(o);});
    sel.onchange=()=>div.setChoiceIndex(+sel.value);
    syncRow.append(sbtn, sel); box.appendChild(syncRow);
    const paintSync=()=>sbtn.classList.toggle("on",sync.getValue());
    const paintDiv=()=>{ sel.value=div.getChoiceIndex(); };
    sync.valueChangedEvent.addListener(paintSync);
    div.valueChangedEvent.addListener(paintDiv);
    paintSync(); paintDiv();
  });

  // ── bottom row: modulation pedals ──
  stompbox(rowBottom,"WOBBLE","#8a6fc0","tremOn",(k)=>{
    makeKnob(k,"tremRate","RATE","hz","#8a6fc0");
    makeKnob(k,"tremDepth","DEPTH","pct","#8a6fc0");
  });
  stompbox(rowBottom,"SWIRL","#c264a8","phaserOn",(k)=>{
    makeKnob(k,"phaserRate","RATE","hz","#c264a8");
    makeKnob(k,"phaserDepth","DEPTH","pct","#c264a8");
  });
  stompbox(rowBottom,"JET","#5f8fd0","flangerOn",(k)=>{
    makeKnob(k,"flangerRate","RATE","hz","#5f8fd0");
    makeKnob(k,"flangerDepth","DEPTH","pct","#5f8fd0");
  });
  stompbox(rowBottom,"CRY","#b0578f","wahOn",(k)=>{
    makeKnob(k,"wahSens","SENS","pct","#b0578f");
    makeKnob(k,"wahPeak","PEAK","pct","#b0578f");
  });
  stompbox(rowBottom,"BOOST","#d0a24a","boostOn",(k)=>makeKnob(k,"boost","GAIN","pct","#d0a24a"));

  // ---- presets (artist → song → tone) ----
  const D=(o)=>Object.assign({drive:0,low:0,mid:0,high:0,delayMix:0,delayTime:0.3,delayFb:0.35,reverb:0,gate:0,cab:false,chorus:0,comp:0,dist:0},o);
  const ARTISTS=[
    {id:"clean",name:"Clean",accent:"#7fe08a",chassis:"linear-gradient(#20272a,#12181a)",songs:[
      {name:"Clean",t:D({delayFb:0.35})}]},
    {id:"top",name:"Twenty One Pilots",accent:"#e5443c",chassis:"linear-gradient(#2a1210,#150706)",songs:[
      {name:"Shy Away",t:D({drive:.45,mid:2,high:4,delayMix:.16,delayTime:.3,delayFb:.3,reverb:.18})},
      {name:"Saturday",t:D({drive:.28,low:-2,mid:3,high:3,delayMix:.1,delayTime:.25,delayFb:.2})},
      {name:"The Outside",t:D({drive:.55,low:2,mid:1,high:1,delayMix:.1,delayTime:.28,delayFb:.25})},
      {name:"Heathens",t:D({drive:.34,low:4,mid:-2,high:-2,delayMix:.3,delayTime:.4,delayFb:.4,reverb:.4})}]},
    {id:"strokes",name:"The Strokes",accent:"#e8b64c",chassis:"linear-gradient(#33281c,#1c150d)",songs:[
      {name:"Reptilia",t:D({drive:.5,low:-5,mid:2,high:6,delayMix:.05,delayTime:.22,delayFb:.15})},
      {name:"Last Nite",t:D({drive:.4,low:-4,mid:3,high:5,delayMix:.05,delayTime:.2,delayFb:.12})},
      {name:"Juicebox",t:D({drive:.66,low:2,mid:2,high:3,delayMix:.04,delayTime:.2,delayFb:.1,dist:1})},
      {name:"You Only Live Once",t:D({drive:.5,low:-2,mid:3,high:4,delayMix:.06,delayTime:.24,delayFb:.15})}]},
    {id:"am",name:"Arctic Monkeys",accent:"#c65b7e",chassis:"linear-gradient(#20182a,#100a16)",songs:[
      {name:"Do I Wanna Know?",t:D({drive:.6,low:4,mid:1,delayMix:.1,delayTime:.3,delayFb:.25,dist:2})},
      {name:"R U Mine?",t:D({drive:.75,low:3,mid:2,delayMix:.08,delayTime:.25,delayFb:.2,dist:2})},
      {name:"Brianstorm",t:D({drive:.62,mid:3,high:4,delayMix:.06,delayTime:.2,delayFb:.15})},
      {name:"505",t:D({drive:.35,low:1,mid:1,high:1,delayMix:.16,delayTime:.35,delayFb:.35,reverb:.28})}]},
    {id:"catfish",name:"Catfish & the Bottlemen",accent:"#5fb0c9",chassis:"linear-gradient(#14202a,#0a1016)",songs:[
      {name:"Kathleen",t:D({drive:.55,low:-1,mid:3,high:4,delayMix:.08,delayTime:.24,delayFb:.18})},
      {name:"Cocoon",t:D({drive:.4,mid:2,high:4,delayMix:.12,delayTime:.3,delayFb:.25,reverb:.2})},
      {name:"Soundcheck",t:D({drive:.6,low:2,mid:2,high:2,delayMix:.08,delayTime:.24,delayFb:.2})},
      {name:"7",t:D({drive:.5,low:1,mid:3,high:3,delayMix:.1,delayTime:.28,delayFb:.22})}]},
    {id:"fike",name:"Dominic Fike",accent:"#e69a3c",chassis:"linear-gradient(#2a1c12,#150c07)",songs:[
      {name:"3 Nights",t:D({drive:.18,low:-1,mid:1,high:4,delayMix:.12,delayTime:.28,delayFb:.25,reverb:.22,chorus:.3,comp:.25})},
      {name:"Chicken Tenders",t:D({drive:.15,low:-2,mid:2,high:5,delayMix:.08,delayTime:.22,delayFb:.15,reverb:.14,chorus:.18,comp:.4})},
      {name:"Babydoll",t:D({drive:.34,low:2,mid:2,high:1,delayMix:.1,delayTime:.3,delayFb:.25,reverb:.3,chorus:.2,comp:.2})},
      {name:"Phone Numbers",t:D({drive:.2,mid:1,high:3,delayMix:.16,delayTime:.34,delayFb:.3,reverb:.28,chorus:.35,comp:.2})},
      {name:"Westcoast Collective",t:D({drive:.22,low:1,mid:1,high:3,delayMix:.12,delayTime:.3,delayFb:.28,reverb:.26,chorus:.3,comp:.22})},
      {name:"King of Everything",t:D({drive:.4,low:1,mid:3,high:2,delayMix:.1,delayTime:.28,delayFb:.25,reverb:.2,chorus:.18,comp:.2})},
      {name:"Misses",t:D({drive:.2,low:2,mid:1,high:1,delayMix:.14,delayTime:.34,delayFb:.3,reverb:.34,chorus:.28,comp:.2})},
      {name:"4x4",t:D({drive:.16,low:-1,mid:2,high:5,delayMix:.08,delayTime:.24,delayFb:.18,reverb:.16,chorus:.22,comp:.35})}]},
    {id:"fender",name:"Sam Fender",accent:"#d94a3f",chassis:"linear-gradient(#2a1414,#150807)",songs:[
      {name:"Seventeen Going Under",t:D({drive:.42,mid:2,high:4,delayMix:.1,delayTime:.28,delayFb:.28,reverb:.22})},
      {name:"Hypersonic Missiles",t:D({drive:.5,low:1,mid:2,high:3,delayMix:.08,delayTime:.25,delayFb:.22,reverb:.18})},
      {name:"Will We Talk?",t:D({drive:.4,low:-1,mid:2,high:5,delayMix:.06,delayTime:.22,delayFb:.2,reverb:.16})},
      {name:"Getting Started",t:D({drive:.48,low:1,mid:3,high:2,delayMix:.08,delayTime:.26,delayFb:.24,reverb:.18})},
      {name:"The Borders",t:D({drive:.38,low:1,mid:1,high:3,delayMix:.16,delayTime:.36,delayFb:.34,reverb:.28})}]},
    {id:"5sos",name:"5 Seconds of Summer",accent:"#4fb0a0",chassis:"linear-gradient(#141a1a,#080b0b)",songs:[
      {name:"She Looks So Perfect",t:D({drive:.6,low:2,mid:1,high:3,delayMix:.05,delayTime:.2,delayFb:.15,reverb:.12,cab:true})},
      {name:"Youngblood",t:D({drive:.5,low:3,mid:2,high:1,delayMix:.06,delayTime:.22,delayFb:.18,reverb:.1,cab:true})},
      {name:"She's Kinda Hot",t:D({drive:.68,low:2,mid:2,high:3,delayMix:.04,delayTime:.2,delayFb:.12,reverb:.1,cab:true,dist:1})},
      {name:"Jet Black Heart",t:D({drive:.55,low:2,mid:1,high:2,delayMix:.1,delayTime:.28,delayFb:.25,reverb:.24,cab:true})},
      {name:"Don't Stop",t:D({drive:.58,low:1,mid:2,high:3,delayMix:.05,delayTime:.2,delayFb:.15,reverb:.12,cab:true})}]},
  ];

  const norm=(id,v)=>{ const [lo,hi]=RANGE[id]; return Math.max(0,Math.min(1,(v-lo)/(hi-lo))); };
  function applyTone(t) {
    ["gate","drive","low","mid","high","delayMix","delayTime","delayFb","reverb","chorus","comp"]
      .forEach(id=>{ if(states[id]) states[id].setNormalisedValue(norm(id, t[id])); });
    dist.setChoiceIndex(t.dist|0);
    cab.setValue(!!t.cab);
  }
  const IMG = { top:"top.jpg", strokes:"strokes.jpg", am:"am.jpg", catfish:"catfish.jpg",
                fike:"fike.jpg", fender:"fender.jpg", "5sos":"5sos.jpg" };
  const POS = { top:"center 22%", catfish:"center 25%", fike:"center 30%",
                fender:"center 32%", "5sos":"center 38%" };
  function skin(a) {
    document.documentElement.style.setProperty("--accent", a.accent);
    document.getElementById("amp").style.setProperty("--chassis", a.chassis);
    document.getElementById("badge").textContent = a.name;
    const img = IMG[a.id];
    const grille = img ? `url("img/${img}") ${POS[a.id] || "center"}/cover` : "#0d0f0c";
    document.getElementById("cabVisual").style.setProperty("--grille", grille);
    const ap = document.getElementById("ampPhoto");
    if (img) { ap.style.background = `url("img/${img}") ${POS[a.id] || "center"}/cover`; ap.style.display = ""; }
    else { ap.style.display = "none"; }
  }

  const artistSel=document.getElementById("artist");
  const songSel=document.getElementById("song");
  ARTISTS.forEach((a,i)=>{ const o=el("option"); o.value=i; o.textContent=a.name; artistSel.appendChild(o); });

  function loadArtist(i, applyFirst=true) {
    const a=ARTISTS[i]; skin(a);
    songSel.innerHTML="";
    a.songs.forEach((s,j)=>{ const o=el("option"); o.value=j; o.textContent=s.name; songSel.appendChild(o); });
    document.getElementById("songWrap").style.display = a.songs.length>1 ? "" : "none";
    if (applyFirst) applyTone(a.songs[0].t);
  }
  artistSel.onchange=()=>loadArtist(+artistSel.value);
  songSel.onchange=()=>applyTone(ARTISTS[+artistSel.value].songs[+songSel.value].t);

  loadArtist(0, false); // set skin without stomping the host's saved state on open

  // ---- snapshots: capture / restore every parameter ----
  const SNAP_SL=["gate","comp","drive","low","mid","high","chorus","delayMix","delayTime","delayFb",
                 "reverb","level","tremRate","tremDepth","phaserRate","phaserDepth","flangerRate","flangerDepth","boost",
                 "wahSens","wahPeak"];
  const SNAP_TG=["compOn","driveOn","chorusOn","delayOn","cab","irOn","delaySync",
                 "tremOn","phaserOn","flangerOn","boostOn","wahOn"];
  const SNAP_CB=["distType","delayDiv"];
  const slState=id=>states[id]||Juce.getSliderState(id);
  function snapshot(){
    const s={sl:{},tg:{},cb:{}};
    SNAP_SL.forEach(id=>{ try{ s.sl[id]=slState(id).getNormalisedValue(); }catch(e){} });
    SNAP_TG.forEach(id=>{ try{ s.tg[id]=Juce.getToggleState(id).getValue(); }catch(e){} });
    SNAP_CB.forEach(id=>{ try{ s.cb[id]=Juce.getComboBoxState(id).getChoiceIndex(); }catch(e){} });
    return s;
  }
  function restore(s){
    if(!s) return;
    for(const id in s.sl) try{ slState(id).setNormalisedValue(s.sl[id]); }catch(e){}
    for(const id in s.tg) try{ Juce.getToggleState(id).setValue(s.tg[id]); }catch(e){}
    for(const id in s.cb) try{ Juce.getComboBoxState(id).setChoiceIndex(s.cb[id]); }catch(e){}
  }

  // ---- A/B compare: two live slots you flip between ----
  const slotAEl=document.getElementById("slotA");
  const slotBEl=document.getElementById("slotB");
  const abCopyEl=document.getElementById("abCopy");
  let slots={A:null,B:null}, active="A";
  const paintAB=()=>{ slotAEl.classList.toggle("on",active==="A"); slotBEl.classList.toggle("on",active==="B"); };
  function setActive(which){
    if(which===active) return;
    slots[active]=snapshot();                    // stash current edits into the current slot
    active=which;
    if(slots[which]==null) slots[which]=snapshot(); // first visit: seed from current so both start equal
    else restore(slots[which]);
    paintAB();
  }
  slotAEl.onclick=()=>setActive("A");
  slotBEl.onclick=()=>setActive("B");
  abCopyEl.onclick=()=>{ slots[active==="A"?"B":"A"]=snapshot(); }; // duplicate current into the other slot

  // ---- named user presets (stored in the browser, best-effort) ----
  const LS="soundbox.presets.v1";
  const userSel=document.getElementById("userSel");
  const userName=document.getElementById("userName");
  const loadStore=()=>{ try{ return JSON.parse(localStorage.getItem(LS))||{}; }catch(e){ return {}; } };
  const saveStore=o=>{ try{ localStorage.setItem(LS,JSON.stringify(o)); }catch(e){} };
  function refreshUser(sel){
    const store=loadStore();
    userSel.innerHTML='<option value="">— recall —</option>';
    Object.keys(store).sort().forEach(n=>{ const o=el("option"); o.value=n; o.textContent=n; userSel.appendChild(o); });
    if(sel) userSel.value=sel;
  }
  document.getElementById("userSave").onclick=()=>{
    const name=(userName.value||"").trim(); if(!name) return;
    const store=loadStore(); store[name]=snapshot(); saveStore(store);
    refreshUser(name); userName.value="";
  };
  userSel.onchange=()=>{ const store=loadStore(); if(store[userSel.value]) restore(store[userSel.value]); };
  document.getElementById("userDel").onclick=()=>{
    const n=userSel.value; if(!n) return;
    const store=loadStore(); delete store[n]; saveStore(store); refreshUser();
  };
  refreshUser();
</script>
</body>
</html>
